<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Italian Verb Quiz</title>

    <style>
        #button-container {margin-top: 30px;}

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Helvetica Neue", sans-serif;
            text-align: center;
            margin: 20px;
            background: #ffffff;
        }

        #question {
            font-size: 32px;
            font-weight: bold;
            margin: 25px 0 10px 0;
        }

        #score {
            font-size: 18px;
            margin-bottom: 25px;
        }

        /*
         * The grid has:
         *
         *   1 column for the tense
         *   7 columns for io, tu, lui, ...
         */

        #grid {
            display: grid;

            grid-template-columns:
                200px repeat(7, minmax(5px, 50px));

            gap: 1px;

            justify-content: center;

            margin: auto;
        }

        .person {
            font-weight: bold;
            font-size: 17px;
            padding: 1px 2px;
        }

        .tense {
            font-weight: bold;
            text-align: right;
            padding: 0px 8px;
            white-space: nowrap;
        }

        .answer-button {
            width: 100%;
            height: 20px; /* button height */
            /* padding: 0;*/

            font-size: 18px;
            
            border: 1px solid #888;
            border-radius: 6px;

            background: #f2f2f2;
        }

        .answer-button:active {
            background: #ccc;
        }

        .wrong {
            background: #ff9999;
        }

        .correct {
            background: #90ee90;
        }

        /*
         * Make the grid fit better on a phone.
         */

        @media (max-width: 700px) {

            body {
                margin: 10px 3px;
            }

            #question {
                font-size: 25px; /* page heading */
            }
    
            #special-grid {
                display:grid;
                grid-template-columns: 22% 22% 27% 27%;
                gap: 3px; /* entry-to-entry gap*/
                width: 100%; /* width of entire grid */
                margin: 0 auto 15px auto;
            }

            .special-label {
                font-size: 11px; /* infinito, gerundio etc*/
            }

            .person {
                font-size: 12px; /* column names */
            }

            .tense {
                width:100%;
                font-size: 12px;
                text-align: right;
                padding: 0 1px 0 0;
                /*padding-right: 4px;*/
            }

            .answer-button {
                height: 20px;
                width: 100%;
                font-size: 10px; /* check mark */
            }
            
            .main-grids {
            	display: grid;
            	gap: 3px;
            	grid-template-columns: 140px repeat(6, 35px);
            	width: 100%;
            }
        }

    </style>

</head>


<!-- all the rest is body -->
<body>

	<!-- Display the main items, defined below in script-->

    <div id="question"></div>

    <!-- <div id="score"></div>-->

    <div id="special-grid"></div>
    
    <div id="indicativo-grid" class="main-grids"></div>
    
    <div id="tempi-composti-grid" class="main-grids"></div>
    
    <div id="congiuntivo-grid" class="main-grids"></div>
    
    <div id="condizionale-grid" class="main-grids"></div>
    
    <div id="imperativo-grid" class="main-grids"></div>

    <div id="button-container">
    <button id="check-button" onclick="checkAnswer()">
        Check Answer
    </button>

    <button id="next-button" onclick="nextQuestion()">
        Next question
    </button>

    <button id="reset-button" onclick="resetStats()">
        Reset statistics
    </button>
    </div>


<script>


// ========================================================
// Settings
// ========================================================

const TENSES = ['presente indicativo', 'imperfetto indicativo'];

const PERSONS = [
    "io",
    "tu",
    "lui",
    "noi",
    "voi",
    "loro",
];

const DISPLAY_PERSONS = {
    lui: ["lui", "lei", "Lei", "egli"],
    loro: ["loro", "Loro", "essi"]
};

const SPECIAL_TENSES = [
    "infinito",
    "gerundio",
    "participio presente",
    "participio passato"
]; //infinito etc
    
const indicativo_tenses = [
	"presente indicativo",
	"imperfetto indicativo",
	"passato remoto",
	"futuro semplice"
];
    
const tempi_composti_tenses = [
	"passato prossimo",
	"trapassato prossimo",
	"trapassato remoto",
	"futuro anteriore"
];
    
const cong_tenses = [
	"presente",
	"imperfetto",
	"passato",
	"trapassato"
];
    
const cond_tenses = [
	"presente",
	"passato"
];


// ========================================================
// Quiz statistics
// ========================================================

// let tenses = [];

let questionIndex = 0;

// Load previous statistics from the iPhone
let stats = JSON.parse(
    localStorage.getItem("italianQuizStats")
) || {attempted: 0, correct: 0};

let answered = false;

function saveStats() {
    localStorage.setItem(
        "italianQuizStats",
        JSON.stringify(stats)
    );
}

function displayTest(disp = 'asdftest') {
	let div = document.createElement("div");
	div.id = "p";
	div.textContent = disp;
	document.body.appendChild(div);
}


// ========================================================
// Read database.csv into 'questions' and shuffle it
// ========================================================

let questions = [];

fetch("database.csv")
    .then(response => response.text())
    .then(text => {

        const lines = text.split(/\r?\n/);

        for (let line of lines) {

            line = line.trim();

            if (!line) {
                continue;
            }

            const parts = line.split(";");

            if (parts.length < 4) {
                continue;
            }

            const verb = parts[0].trim();
            const form = parts[1].trim();
            const person = parts[2].trim();
            const tense = parts[3].trim();

            questions.push({
                verb: verb,
                form: form,
                person: person,
                tense: tense
            });
        }
        
        // only include indicated tenses
        questions = questions.filter(x => TENSES.includes(x.tense));

		// error message
        if (questions.length === 0) {
            alert("No questions found/remaining");
            return;
        }

        // Randomize question order
        for (let i = questions.length - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
	
			[questions[i], questions[j]] =
				[questions[j], questions[i]];
		}

        displayQuestion();

    })
    .catch(error => {

        alert(
            "Could not load database.csv.\n\n" +
            "Make sure database.csv is in the same folder."
        );

        console.error(error);
    });


function buttonMaker(person, tense, grid) {
	const button = document.createElement("button");
	button.className = "answer-button";
	button.dataset.tense = tense;
	if (grid == 'congiuntivo-grid') {
		button.dataset.tense += ' congiuntivo';
	} else if (grid == 'condizionale-grid') {
		button.dataset.tense += ' condizionale';
	}
	button.dataset.person = person;

	button.onclick = function() {
		selectAnswer(button);
	};
	
	if (!TENSES.includes(tense)) {
		button.disabled = true;
		button.style.backgroundColor = 'black';
		button.style.cursor = 'not-allowed';
	}

	return button
}

// ========================================================
// Display question
// ========================================================

function displayQuestion() {

    answered = false;

    const q = questions[questionIndex];

    document.getElementById("question").textContent =
        q.form + " (" + q.verb + ")";

    /*document.getElementById("score").textContent =
        "Question " +
        (questionIndex + 1) +
        " / " +
        questions.length +
        "     Score: " +''
        //score;*/
	
	const specialGrid = document.getElementById("special-grid");
	
	// Remove old grids
	specialGrid.innerHTML = "";
	
	// ----------------------------------------------------
	// Special forms: infinito, gerundio, participi
	// ----------------------------------------------------

	for (const tense of SPECIAL_TENSES) {
	
		const item = document.createElement("div");
		item.className = "special-item";
	
		// Label
		const label = document.createElement("div");
		label.className = "special-label";
		label.textContent = tense;
	
		item.appendChild(label);
	
		// Button
		const button = document.createElement("button");
		button.className = "answer-button";
		button.textContent = "";
	
		button.dataset.tense = tense;
		button.dataset.person = "-";
	
		button.onclick = function() {
			selectAnswer(button);
		};
	
		item.appendChild(button);
		specialGrid.appendChild(item);
	}

	// main grids
	for (let i=1; i<=5; i += 1) {
		let obj;
		let title;
		let tenses;
		if (i == 1) {
			obj = "indicativo-grid";
			title = "INDICATIVO";
			tenses = indicativo_tenses;
		} else if (i == 2) {
			obj = "tempi-composti-grid";
			title = "COMPOSTI";
			tenses = tempi_composti_tenses;
		} else if (i == 3) {
			obj = "condizionale-grid";
			title = "CONDIZIONALE";
			tenses = cond_tenses;
		} else if (i == 4) {
			obj = "congiuntivo-grid";
			title = "CONGIUNTIVO";
			tenses = cong_tenses;
		} else if (i == 5) {
			obj = "imperativo-grid";
			title = "IMPERATIVO";
			tenses = [''];
		};
	
		const Grid = document.getElementById(obj);
		Grid.innerHTML = ""; // make sure it's initialized
		
		// Table title (upper left entry)
		const header = document.createElement("div");
		header.className="tense";
		header.textContent = title;
		Grid.appendChild(header);
		
		// Column headers
		for (let person of PERSONS) {
			
			if (obj == 'imperativo-grid') {
				if (person == 'io') {
					Grid.appendChild(document.createElement('div'));
					continue;
				} else if (person == 'lui') {
					person = 'Lei';
				} else if (person == 'loro') {
					person = 'Loro';
				}
			}
			const header = document.createElement("div");
			header.className = "person";
			header.textContent = person;
			Grid.appendChild(header);
		}
		
		// Rows
		for (const tense of tenses) {
		
			// Make row header
			const tenseLabel = document.createElement("div");
			tenseLabel.className = "tense";
			tenseLabel.textContent = tense;
			Grid.appendChild(tenseLabel);
			
			// make interior buttons
			for (const person of PERSONS) {   
		
				// skip 'io' in imperativo case
				if (person == 'io' && obj == 'imperativo-grid'){
					Grid.appendChild(document.createElement('div'));
					continue;
				}
				
				Grid.appendChild(buttonMaker(person, tense, obj));
			}
		}
		
		// extra row for space below table
		Grid.appendChild(document.createElement('p'));
	}

} // ending displayQuestion



// ========================================================
// Check answer
// ========================================================

function checkAnswer() {

    const q = questions[questionIndex];

    // Find every CSV line with this verb + form
    const correctAnswers = questions.filter(
        x => x.verb === q.verb && x.form === q.form
    );

    // Get the user's selections
    const selected = [];

    document.querySelectorAll(".answer-button.selected")
        .forEach(button => {

            selected.push({
                tense: button.dataset.tense,
                person: button.dataset.person
            });

        });

    // Convert both to strings so we can compare sets
    const correctSet = new Set(
        correctAnswers.map(
            x => x.tense + "|||" + x.person
        )
    );

    const selectedSet = new Set(
        selected.map(
            x => x.tense + "|||" + x.person
        )
    );

	//displayTest(correctSet.values().next().value)
	
    // Check that the sets are identical
    const correct =
        correctSet.size === selectedSet.size &&
        [...correctSet].every(
            x => selectedSet.has(x)
        );

    if (correct) {

        stats.attempted++;
        stats.correct++;

        saveStats();

        // Turn selected buttons green
        document.querySelectorAll(".answer-button.selected")
            .forEach(button => {
                button.classList.remove("selected");
                button.classList.add("correct");
                button.textContent = "✓";
                button.disabled = true;
            });

        answered = true;

        setTimeout(nextQuestion, 600);

    }

    else {
    stats.attempted++;
    saveStats();

    // Turn the user's wrong selections red
    document.querySelectorAll(".answer-button.selected")
        .forEach(button => {
            button.classList.remove("selected");
            button.classList.add("wrong");
            button.textContent = "✗";
            button.disabled = true;
        });

    // Turn all correct answers green
    document.querySelectorAll(".answer-button")
        .forEach(button => {
            const key =
                button.dataset.tense + "|||" +
                button.dataset.person;

            if (correctSet.has(key)) {
                button.classList.add("correct");
                button.textContent = "✓";
                button.disabled = true;
            }
        });
	}
}

function resetStats() {

    if (confirm("Reset all statistics?")) {

        stats = {
            attempted: 0,
            correct: 0
        };

        saveStats();

        displayQuestion();
    }
}

function selectAnswer(button) {

    if (answered) {
        return;
    }

    button.classList.toggle("selected");

    if (button.classList.contains("selected")) {
        button.textContent = "✓";
    }
    else {
        button.textContent = "";
    }
}


// ========================================================
// Next question
// ========================================================

function nextQuestion() {

    questionIndex++;

	// display on final screen
    if (questionIndex >= questions.length) {

        document.getElementById("question").textContent =
            "Finished!";

        /*document.getElementById("score").textContent =
            "Final score: " +
            score +
            " / " +
            questions.length;*/

        //document.getElementById("grid").innerHTML = "";

        document.getElementById("next-button").style.display =
            "none";

        return;
    }

    displayQuestion();
}


</script>

</body>

</html>
