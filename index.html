<!DOCTYPE html>
<html lang="en">

<!--
Title and CSS:



-->
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Italian Verb Quiz</title>

    <style>
        #button-container {margin-top: 30px;}

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Helvetica Neue", sans-serif;
            text-align: center;
            margin: 20px;
            background: #ffffff;
        }

        #question {
            font-size: 32px;
            font-weight: bold;
            margin: 25px 0 10px 0;
        }

        #score {
            font-size: 18px;
            margin-bottom: 25px;
        }

        /*
         * The grid has:
         *
         *   1 column for the tense
         *   7 columns for io, tu, lui, ...
         */

        #grid {
            display: grid;

            grid-template-columns:
                200px repeat(7, minmax(5px, 50px));

            gap: 1px;

            justify-content: center;

            margin: auto;
        }

        .person {
            font-weight: bold;
            font-size: 17px;
            padding: 8px 2px;
        }

        .tense {
            font-weight: bold;
            text-align: right;
            padding: 0px 8px;
            white-space: nowrap;
        }

        .answer-button {
            width: 100%;
            height: 20px; // button height
            //padding: 0;

            font-size: 18px;
            
            border: 1px solid #888;
            border-radius: 6px;

            background: #f2f2f2;
        }

        .answer-button:active {
            background: #ccc;
        }

        .wrong {
            background: #ff9999;
        }

        .correct {
            background: #90ee90;
        }

        /*
         * Make the grid fit better on a phone.
         */

        @media (max-width: 700px) {

            body {
                margin: 10px 3px;
            }

            #question {
                font-size: 27px;
            }
    
            #special-grid {
                display:grid;
                grid-template-columns: 22% 22% 27% 27%;
                gap: 3px;
                width: 100%;
                margin: 0 auto 15px auto;
            }

            #imperative-grid {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 3px;
                width: 100%;
                margin: 0 auto 15px auto;
            }

            .special-label {
                font-size: 11px;
            }

            #grid {
                grid-template-columns:
                    140px repeat(6, 30px);

                gap: 3px;

                width: 100%;
            }

            .person {
                font-size: 14px;
            }

            .tense {
                width:140px;
                font-size: 12px;
                text-align: right;
                padding: 0 1px 0 0;
                //padding-right: 4px;
            }

            .answer-button {
                height: 20px;
                width: 100%;
                font-size: 16px;
            }
        }

    </style>

</head>


<!-- all the rest is body -->
<body>

	<!-- Display the main items, defined below in script-->

    <div id="question"></div>

    <div id="score"></div>

    <div id="special-grid"></div>

    <div id="imperative-grid"></div>

    <div id="grid"></div>


    <div id="button-container">
    <button id="check-button" onclick="checkAnswer()">
        Check Answer
    </button>

    <button id="next-button" onclick="nextQuestion()">
        Next question
    </button>

    <button id="reset-button" onclick="resetStats()">
        Reset statistics
    </button>
    </div>


<script>


// ========================================================
// Settings
// ========================================================

const PERSONS = [
    "io",
    "tu",
    "lui",
    "noi",
    "voi",
    "loro",
];

const DISPLAY_PERSONS = {
    lui: ["lui", "lei", "Lei", "egli"],
    loro: ["loro", "Loro", "essi"]
};

const IMPERATIVE_PERSONS = [
    "tu",
    "Lei",
    "noi",
    "voi",
    "Loro"
];

const SPECIAL_TENSES = [
    "infinito",
    "gerundio",
    "participio presente",
    "participio passato"
];

const tenses = [
    //"a test of very long text which is definitely going to run into the right wall please",
    "presente indicativo",
    "imperfetto indicativo",
    "passato remoto",
    "futuro semplice",
    "passato prossimo",
    "trapassato prossimo",
    "trapassato remoto",
    "futuro anteriore",
    "presente congiuntivo",
    "imperfetto congiuntivo",
    "passato congiuntivo",
    "trapassato congiuntivo",
    "presente condizionale",
    "passato condizionale"
    ]


// ========================================================
// Quiz statistics
// ========================================================

let questions = [];

// let tenses = [];

let questionIndex = 0;

// Load previous statistics from the iPhone
let stats = JSON.parse(
    localStorage.getItem("italianQuizStats")
) || {attempted: 0, correct: 0};

let answered = false;

function saveStats() {
    localStorage.setItem(
        "italianQuizStats",
        JSON.stringify(stats)
    );
}


// ========================================================
// Read database.csv
// ========================================================

fetch("database.csv")
    .then(response => response.text())
    .then(text => {

        const lines = text.split(/\r?\n/);

        for (let line of lines) {

            line = line.trim();

            if (!line) {
                continue;
            }

            const parts = line.split(";");

            if (parts.length < 4) {
                continue;
            }

            const verb = parts[0].trim();
            const form = parts[1].trim();
            const person = parts[2].trim();
            const tense = parts[3].trim();

            questions.push({
                verb: verb,
                form: form,
                person: person,
                tense: tense
            });
        }

        if (questions.length === 0) {
            alert("No questions found in database.csv");
            return;
        }

        // Randomize question order
        shuffle(questions);

        displayQuestion();

    })
    .catch(error => {

        alert(
            "Could not load database.csv.\n\n" +
            "Make sure database.csv is in the same folder."
        );

        console.error(error);
    });


// ========================================================
// Random shuffle (used above when reading 'database.csv')
// ========================================================

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
            [array[j], array[i]];
    }
}


// ========================================================
// Display question
// ========================================================

function displayQuestion() {

    answered = false;

    const q = questions[questionIndex];

    document.getElementById("question").textContent =
        q.form + " (" + q.verb + ")";

    document.getElementById("score").textContent =
        "Question " +
        (questionIndex + 1) +
        " / " +
        questions.length +
        "     Score: " +
        score;


const grid = document.getElementById("grid");
const specialGrid = document.getElementById("special-grid");

// Remove old grids
grid.innerHTML = "";
specialGrid.innerHTML = "";

// ----------------------------------------------------
// Special forms: infinito, gerundio, participi
// ----------------------------------------------------

for (const tense of SPECIAL_TENSES) {

    const item = document.createElement("div");
    item.className = "special-item";

    // Label
    const label = document.createElement("div");
    label.className = "special-label";
    label.textContent = tense;

    item.appendChild(label);

    // Button
    const button = document.createElement("button");
    button.className = "answer-button";
    button.textContent = "";

    button.dataset.tense = tense;
    button.dataset.person = "-";

    button.onclick = function() {
        selectAnswer(button);
    };

    item.appendChild(button);
    specialGrid.appendChild(item);
}

const imperativeGrid = document.getElementById("imperative-grid");
imperativeGrid.innerHTML = "";

for (const person of IMPERATIVE_PERSONS) {

    const header = document.createElement("div");
    header.className = "person";
    header.textContent = person;
    imperativeGrid.appendChild(header);
}

for (const person of IMPERATIVE_PERSONS) {

    const button = document.createElement("button");

    button.className = "answer-button";
    button.textContent = "";

    button.dataset.tense = "imperativo";
    button.dataset.person = person;

    button.onclick = function() {
        selectAnswer(button);
    };

    imperativeGrid.appendChild(button);
}

// ----------------------------------------------------
// Main grid: person headings
// ----------------------------------------------------

// Empty upper-left corner
const empty = document.createElement("div");
grid.appendChild(empty);

// Column headings
for (const person of PERSONS) {

    const header = document.createElement("div");

    header.className = "person";

    let displayPerson = person;

    if (person === "lui") {
        displayPerson = DISPLAY_PERSONS.lui[
            Math.floor(Math.random() * DISPLAY_PERSONS.lui.length)
        ];
    }

    if (person === "loro") {
        displayPerson = DISPLAY_PERSONS.loro[
            Math.floor(Math.random() * DISPLAY_PERSONS.loro.length)
        ];
    }

    header.textContent = displayPerson;

    grid.appendChild(header);
}

// ----------------------------------------------------
// Main grid rows
// ----------------------------------------------------

for (const tense of tenses) {

    // Tense label
    const tenseLabel = document.createElement("div");

    tenseLabel.className = "tense";
    tenseLabel.textContent = tense;

    grid.appendChild(tenseLabel);

    // Don't create an "io" button for imperativo
    for (const person of PERSONS) {

        if (tense === "imperativo" && person === "io") {
            // Empty cell instead of a button
            const emptyCell = document.createElement("div");
            grid.appendChild(emptyCell);
            continue;
        }

        const button = document.createElement("button");

        button.className = "answer-button";
        button.textContent = "";

        button.dataset.tense = tense;
        button.dataset.person = person;

        button.onclick = function() {
            selectAnswer(button);
        };

        grid.appendChild(button);
    }
}

}


// ========================================================
// Check answer
// ========================================================

function checkAnswer() {

    const q = questions[questionIndex];

    // Find every CSV line with this verb + form
    const correctAnswers = questions.filter(
        x => x.verb === q.verb && x.form === q.form
    );

    // Get the user's selections
    const selected = [];

    document.querySelectorAll(".answer-button.selected")
        .forEach(button => {

            selected.push({
                tense: button.dataset.tense,
                person: button.dataset.person
            });

        });


    // Convert both to strings so we can compare sets
    const correctSet = new Set(
        correctAnswers.map(
            x => x.tense + "|||" + x.person
        )
    );

    const selectedSet = new Set(
        selected.map(
            x => x.tense + "|||" + x.person
        )
    );


    // Check that the sets are identical
    const correct =
        correctSet.size === selectedSet.size &&
        [...correctSet].every(
            x => selectedSet.has(x)
        );


    if (correct) {

        stats.attempted++;
        stats.correct++;

        saveStats();

        // Turn selected buttons green
        document.querySelectorAll(".answer-button.selected")
            .forEach(button => {
                button.classList.remove("selected");
                button.classList.add("correct");
                button.textContent = "✓";
                button.disabled = true;
            });

        answered = true;

        setTimeout(nextQuestion, 600);

    }

    else {
    stats.attempted++;
    saveStats();

    // Turn the user's wrong selections red
    document.querySelectorAll(".answer-button.selected")
        .forEach(button => {
            button.classList.remove("selected");
            button.classList.add("wrong");
            button.textContent = "✗";
            button.disabled = true;
        });

    // Turn all correct answers green
    document.querySelectorAll(".answer-button")
        .forEach(button => {

            const key =
                button.dataset.tense + "|||" +
                button.dataset.person;

            if (correctSet.has(key)) {
                button.classList.add("correct");
                button.textContent = "✓";
                button.disabled = true;
            }
        });
}
}

function resetStats() {

    if (confirm("Reset all statistics?")) {

        stats = {
            attempted: 0,
            correct: 0
        };

        saveStats();

        displayQuestion();
    }
}

function selectAnswer(button) {

    if (answered) {
        return;
    }

    button.classList.toggle("selected");

    if (button.classList.contains("selected")) {
        button.textContent = "✓";
    }
    else {
        button.textContent = "";
    }
}


// ========================================================
// Next question
// ========================================================

function nextQuestion() {

    questionIndex++;

    if (questionIndex >= questions.length) {

        document.getElementById("question").textContent =
            "Finished!";

        document.getElementById("score").textContent =
            "Final score: " +
            score +
            " / " +
            questions.length;

        document.getElementById("grid").innerHTML = "";

        document.getElementById("next-button").style.display =
            "none";

        return;
    }

    displayQuestion();
}


</script>

</body>

</html>
