<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Italian Verb Quiz</title>

    <style>
        #button-container {margin-top: 30px;}

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Helvetica Neue", sans-serif;
            text-align: center;
            margin: 20px;
            background: #ffffff;
        }

        #question {
            font-size: 32px;
            font-weight: bold;
            margin: 25px 0 10px 0;
        }

        #score {
            font-size: 18px;
            margin-bottom: 25px;
        }

        /*
         * The grid has:
         *
         *   1 column for the tense
         *   7 columns for io, tu, lui, ...
         */

        #grid {
            display: grid;

            grid-template-columns:
                200px repeat(7, minmax(5px, 50px));

            gap: 1px;

            justify-content: center;

            margin: auto;
        }

        .person {
            font-weight: bold;
            font-size: 17px;
            padding: 1px 2px;
        }

        .tense {
            font-weight: bold;
            text-align: right;
            padding: 0px 8px;
            white-space: nowrap;
        }

        .answer-button {
            width: 100%;
            height: 20px; /* button height */
            /* padding: 0;*/

            font-size: 18px;
            
            border: 1px solid #888;
            border-radius: 6px;

            background: #f2f2f2;
        }

        .answer-button:active {
            background: #ccc;
        }

        .wrong {
            background: #ff9999;
        }

        .correct {
            background: #90ee90;
        }

        /*
         * Make the grid fit better on a phone.
         */

        @media (max-width: 700px) {

            body {
                margin: 10px 3px;
            }

            #question {
                font-size: 25px; /* page heading */
            }
    
            #special-grid {
                display:grid;
                grid-template-columns: 22% 22% 27% 27%;
                gap: 3px; /* entry-to-entry gap*/
                width: 100%; /* width of entire grid */
                margin: 0 auto 1px auto;
            }

            .special-label {
                font-size: 11px; /* infinito, gerundio etc*/
            }

            .person {
                font-size: 12px; /* column names */
            }

            .tense {
                width:100%;
                font-size: 12px;
                text-align: right;
                padding: 0 1px 0 0;
                /*padding-right: 4px;*/
            }

            .answer-button {
                height: 20px;
                width: 100%;
                font-size: 10px; /* check mark */
            }
            
            .main-grids {
            	display: grid;
            	gap: 3px;
            	grid-template-columns: 140px repeat(6, 35px);
            	width: 100%;
            }
        }

    </style>

</head>


<!-- all the rest is body -->
<body>

	<!-- Display the main items, defined below in script-->

	<div id="selection-screen0">
	
		<h2>Select language</h2>
		<div id="language-selection"></div>
		
		<br>
		<button onclick="makeSelectionScreen1()">Make Selection</button>
	
	</div>

	<div id="selection-screen1" style="display:none">
	
		<h2>Select verbs</h2>
		<div id="verb-selection"></div>
		
		<br>
		<button onclick="makeSelectionScreen2()">Make Selection</button>
	
	</div>
	
	<div id="selection-screen2" style="display:none;">
		<h2> Select tenses</h2>
		<div id="tense-selection"></div>
		<h2></h2>
		<button onclick="startQuiz()">Make Selection and Start</button>
	</div>
	
	<div id="quiz-screen" style="display:none;">
		<div id="question"></div>
		<!-- <div id="score"></div>-->
		<div id="special-grid"></div>
		<br><br>
		<div id="indicativo-grid" class="main-grids"></div>
		<br><br>
		<div id="tempi-composti-grid" class="main-grids"></div>
		<br><br>
		<div id="congiuntivo-grid" class="main-grids"></div> 
		<br><br>
		<div id="condizionale-grid" class="main-grids"></div>
		<br><br>
		<div id="imperativo-grid" class="main-grids"></div>
	
		<div id="button-container">
		<button id="check-button" onclick="checkAnswer()">
			Check Answer
		</button>
	
		<button id="next-button" onclick="nextQuestion()">
			Next question
		</button>
	
		<!--<button id="reset-button" onclick="resetStats()">
			Reset statistics
		</button>-->
		</div>
	</div>


<script>


// ========================================================
// Settings
// ========================================================

// const TENSES = ['presente indicativo', 'imperfetto indicativo'];
// const VERBS = ['essere'];

const LANGUAGES = {
    "Français": {
    	file: "fr_database.csv",
        persons: [
            "je", "tu", "il", "nous", "vous", "ils"
        ],
        special_tenses: [
            "infinitif",
            "participe présent",
            "participe passé",
            "forme pronominale"
        ],
        tense_groups: {
            indicatif: [
                "présent indicatif",
                "imparfait indicatif",
                "passé simple",
                "futur simple"
            ],
            formes_composees: [
                "passé composé",
                "plus-que-parfait",
                "passé antérieur",
                "futur antérieur"
            ],
            subjonctif: [
                "présent subjonctif",
                "imparfait subjonctif",
                "passé subjonctif",
                "plus-que-parfait subjonctif"
            ],
            conditionnel: [
                "présent conditionnel",
                "passé conditionnel",
                "passé II conditionnel"
            ],
            imperatif: [
                "présent imperatif",
                "passé imperatif"
            ]
        }
    },
    "Italiano": {
    	file: "it_database.csv",
        persons: [
            "io", "tu", "lui", "noi", "voi", "loro"
        ],
        special_tenses: [
            "infinito",
            "gerundio",
            "participio presente",
            "participio passato"
        ],
        tense_groups: {
            'Indicativo': [
                "presente indicativo",
                "imperfetto indicativo",
                "passato remoto",
                "futuro semplice"
            ],
            'Composti': [
                "passato prossimo",
                "trapassato prossimo",
                "trapassato remoto",
                "futuro anteriore"
            ],
            'Congiuntivo': [
                "presente congiuntivo",
                "imperfetto congiuntivo",
                "passato congiuntivo",
                "trapassato congiuntivo"
            ],
            'Condizionale': [
                "presente condizionale",
                "passato condizionale"
            ],
            'Imperativo': []
        }
    },
};

let TENSES = [];
let VERBS = [];
let LANG = "";

const PERSONS = [
    "io",
    "tu",
    "lui",
    "noi",
    "voi",
    "loro",
];
const SPECIAL_TENSES = [
    "infinito",
    "gerundio",
    "participio presente",
    "participio passato"
];
const indicativo_tenses = [
	"presente indicativo",
	"imperfetto indicativo",
	"passato remoto",
	"futuro semplice"
];
const tempi_composti_tenses = [
	"passato prossimo",
	"trapassato prossimo",
	"trapassato remoto",
	"futuro anteriore"
];
const cong_tenses = [
	"presente congiuntivo",
	"imperfetto congiuntivo",
	"passato congiuntivo",
	"trapassato congiuntivo"
];
const cond_tenses = [
	"presente condizionale",
	"passato condizionale"
];

const Fr_PERSONS = ["je",
 "tu",
 "il",
 "nous",
 "vous",
 "ils"
];
const SPECIALE_TENSES = [
	"infinitif",
	"participe présent",
	"participe passé",
	"forme pronominale"
];
const indicatif_tenses = [
	"présent indicatif",
	"imparfait indicatif",
	"passé simple",
	"futur simple"
];
const formes_composees_tenses = [
	"passé composé",
	"plus-que-parfait",
	"passé antérieur",
	"futur antérieur"
];
const subjonctif_tenses = [
	"présent subjonctif",
	"imparfait subjonctif",
	"passé subjonctif",
	"plus-que-parfait subjonctif"
];
const conditionnel_tenses = [
	"présent conditionnel",
	"passé conditionnel",
	"passé II conditionnel"
];
const imperatif_tenses = [
	"présent imperatif",
	"passé imperatif"
];


// ========================================================
// Quiz statistics
// ========================================================

let questionIndex = 0;

let answered = false;

function displayTest(disp = 'asdftest') {
	let div = document.createElement("div");
	div.id = "p";
	div.textContent = disp;
	document.body.appendChild(div);
}


// ========================================================
// Read database.csv into 'questions' and shuffle it
// ========================================================

let questions = [];

makeSelectionScreen0();
    
function dispTenses(tenses, document, tenseDiv, title) {

	heading = document.createElement("h4");
    heading.textContent = title;
    tenseDiv.appendChild(heading);
    
	for (const tense of tenses) {

        const label = document.createElement("label");

        const checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.value = tense;
        
        checkbox.className = "tense-checkbox";

        label.appendChild(checkbox);
        label.append(" " + tense);

        tenseDiv.appendChild(label);
        tenseDiv.appendChild(document.createElement("br"));
    }
    
    
}

function makeSelectionScreen0() {

	displayTest(0);

	const langDiv = document.getElementById("language-selection");
	
	for (const lang of Object.keys(LANGUAGES)) {
		const checkbox = document.createElement("input");
		checkbox.type = "checkbox";
		checkbox.value = lang;
		checkbox.className = "language-checkbox";
		
		const label = document.createElement("label");
		label.appendChild(checkbox);
		label.append(" " + lang);
		
		langDiv.appendChild(label);
		langDiv.appendChild(document.createElement("br"));
	}
}
      
function makeSelectionScreen1() {

	LANG = [...document.querySelectorAll(".language-checkbox:checked")]
	    .map(x => x.value);
	if (LANG.length === 0) {
		alert("Select a language.");
		return;
	} else if (LANG.length > 1) {
		alert("Select only one language.");
		return;
	}
	LANG = LANG[0];
	
	displayTest(LANGUAGES[LANG].file);
	fetch(LANGUAGES[LANG].file, {cache: "no-store"})
		.then(response => response.text())
		.then(text => {
	
			const lines = text.split(/\r?\n/);
	
			for (let line of lines) {
	
				line = line.trim();
	
				if (!line) {
					continue;
				}
	
				const parts = line.split(";");
	
				if (parts.length < 4) {
					continue;
				}
	
				const verb = parts[0].trim();
				const form = parts[1].trim();
				const person = parts[2].trim();
				const tense = parts[3].trim();
	
				questions.push({
					verb: verb,
					form: form,
					person: person,
					tense: tense
				});
			}
			
			let verbs;
			
			//// FIX THIS LATER
			if (LANG == 'Français') {
				verbs = ['avoir', 'pouvoir'];
			} else if (LANG == 'Italiano') {
				verbs = [...new Set(questions.map(q => q.verb))];
			}

			const verbDiv = document.getElementById("verb-selection");
		
			for (const verb of verbs) {
		
				const label = document.createElement("label");
		
				const checkbox = document.createElement("input");
		
				checkbox.type = "checkbox";
				checkbox.value = verb;
				checkbox.className = "verb-checkbox";
		
				label.appendChild(checkbox);
				label.append(" " + verb);
		
				verbDiv.appendChild(label);
				verbDiv.appendChild(document.createElement("br"));
			}
			
			document.getElementById('selection-screen0').style.display = 'none';
			document.getElementById('selection-screen1').style.display = 'block';
	
		})
		.catch(error => {
	
			alert(
				"Could not load "+LANGUAGES[LANG].file+".\n\n" +
				"Make sure "+LANGUAGES[LANG].file+" is in the same folder."
			);
	
			console.error(error);
		});

}

function makeSelectionScreen2() {

    VERBS = [...document.querySelectorAll(".verb-checkbox:checked")]
        .map(x => x.value);

    if (VERBS.length === 0) {
        alert("Select at least one verb.");
        return;
    }

	/*const tenses = [...new Set(
        questions.map(q => q.tense)
    )];*/
	const tenseDiv = document.getElementById("tense-selection");
    dispTenses(SPECIAL_TENSES, document, tenseDiv, '');
    for (const type of Object.keys(LANGUAGES[LANG].tense_groups)) {
    	dispTenses(LANGUAGES[LANG].tense_groups[type], document, tenseDiv, type);
    }
    /*dispTenses(indicativo_tenses, document, tenseDiv, 'Indicativo');
    dispTenses(tempi_composti_tenses, document, tenseDiv, 'Tempi composti');
    dispTenses(cong_tenses, document, tenseDiv, 'Congiuntivo');
    dispTenses(cond_tenses, document, tenseDiv, 'Condizionale');*/
    dispTenses(['imperativo'], document, tenseDiv, 'Imperativo');
    
    document.getElementById('selection-screen1').style.display = 'none';
    document.getElementById('selection-screen2').style.display = 'block';
}

function startQuiz() {

    TENSES = [...document.querySelectorAll(".tense-checkbox:checked")]
        .map(x => x.value);

    if (TENSES.length === 0) {
        alert("Select at least one tense.");
        return;
    }


    questions = questions.filter(q =>
        VERBS.includes(q.verb) &&
        TENSES.includes(q.tense)
    );


    if (questions.length === 0) {
        alert("No questions found for those selections.");
        return;
    }


    // Randomize question order
    for (let i = questions.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [questions[i], questions[j]] =
            [questions[j], questions[i]];
    }


    questionIndex = 0;

    document.getElementById("selection-screen2").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";

    displayQuestion();
}


function buttonMaker(person, tense, grid) {
	const button = document.createElement("button");
	button.className = "answer-button";
	button.dataset.tense = tense;

	button.dataset.person = person;

	button.onclick = function() {
		selectAnswer(button);
	};
	
	if (!TENSES.includes(tense)) {
		button.disabled = true;
		button.style.backgroundColor = 'black';
		button.style.cursor = 'not-allowed';
	}

	return button
}

// ========================================================
// Display question
// ========================================================

function displayQuestion() {

    answered = false;

    const q = questions[questionIndex];

    document.getElementById("question").textContent =
        q.form + " (" + q.verb + ")";
        
    // special grid
    const Grid = document.getElementById('special-grid');
    Grid.innerHTML = "";
    for (let tense of LANGUAGES[LANG].special_tenses) {
    	const header = document.createElement('div');
    	header.className = 'person';
    	header.textContent = tense;
    	Grid.appendChild(header);
    }
    for (let tense of LANGUAGES[LANG].special_tenses) {
    	Grid.appendChild(buttonMaker('-', tense, 'special-grid'));
    }
    

	// main grids
	
	for (let i=1; i<=5; i += 1) {
		let obj;
		let title;
		let tenses;
		if (i == 1) {
			obj = "indicativo-grid";
			title = "INDICATIVO";
			tenses = indicativo_tenses;
		} else if (i == 2) {
			obj = "tempi-composti-grid";
			title = "COMPOSTI";
			tenses = tempi_composti_tenses;
		} else if (i == 3) {
			obj = "condizionale-grid";
			title = "CONDIZIONALE";
			tenses = cond_tenses;
		} else if (i == 4) {
			obj = "congiuntivo-grid";
			title = "CONGIUNTIVO";
			tenses = cong_tenses;
		} else if (i == 5) {
			obj = "imperativo-grid";
			title = "IMPERATIVO";
			tenses = ['imperativo'];
		};
	
		const Grid = document.getElementById(obj);
		Grid.innerHTML = ""; // make sure it's initialized
		
		// Table title (upper left entry)
		const header = document.createElement("div");
		header.className="tense";
		header.textContent = title;
		
		// Column headers
		for (let person of PERSONS) {
			
			
			const header = document.createElement('div');
			header.className = 'person';
			header.textContent = person;
			
			if (obj == 'imperativo-grid'){
				if (person == 'io'){
					header.textContent = '';
				} else if (person == 'lui') {
					header.textContent = 'Lei';
				} else if (person == 'loro') {
					header.textContent = 'Loro';
				}
			}
			
			Grid.appendChild(header);
		}
		
		// Rows
		for (const tense of tenses) {
		
			// Make row header
			if (tense != 'imperativo') {
				const tenseLabel = document.createElement("div");
				tenseLabel.className = "tense";
				tenseLabel.textContent = tense;
				Grid.appendChild(tenseLabel);
			} else {
				const tenseLabel = document.createElement("div");
				tenseLabel.className = "tense";
				tenseLabel.textContent = '';
				Grid.appendChild(tenseLabel);
			}
			
			// make interior buttons
			for (const person of PERSONS) {   
		
				if (obj == 'imperativo-grid') {
					if (person == 'io') {
						Grid.appendChild(document.createElement('div'));
						continue;
					} else if (person == 'lui') {
						Grid.appendChild(buttonMaker('Lei', tense, obj));
						continue;
					} else if (person == 'loro') {
						Grid.appendChild(buttonMaker('Loro', tense, obj));
						continue;
					}
				}
				
				Grid.appendChild(buttonMaker(person, tense, obj));
			}
		}
		
		// extra row for space below table
		//Grid.appendChild(document.createElement('p'));
	}

} // ending displayQuestion


function checkAnswer() {

    const q = questions[questionIndex];

    // Find every CSV line with this verb + form
    const correctAnswers = questions.filter(
        x => x.verb === q.verb && x.form === q.form
    );

    // Get the user's selections
    const selected = [];

    document.querySelectorAll(".answer-button.selected")
        .forEach(button => {

            selected.push({
                tense: button.dataset.tense,
                person: button.dataset.person
            });

        });

    // Convert both to strings so we can compare sets
    const correctSet = new Set(
        correctAnswers.map(
            x => x.tense + "|||" + x.person
        )
    );

    const selectedSet = new Set(
        selected.map(
            x => x.tense + "|||" + x.person
        )
    );
	
    // Check that the sets are identical
    const correct =
        correctSet.size === selectedSet.size &&
        [...correctSet].every(
            x => selectedSet.has(x)
        );

    if (correct) {

        /* stats.attempted++;
        stats.correct++;

        saveStats(); */

        // Turn selected buttons green
        document.querySelectorAll(".answer-button.selected")
            .forEach(button => {
                button.classList.remove("selected");
                button.classList.add("correct");
                button.textContent = "✓";
                button.disabled = true;
            });

        answered = true;

        setTimeout(nextQuestion, 600);

    }

    else {
    /* stats.attempted++;
    saveStats();*/

    // Turn the user's wrong selections red
    document.querySelectorAll(".answer-button.selected")
        .forEach(button => {
            button.classList.remove("selected");
            button.classList.add("wrong");
            button.textContent = "✗";
            button.disabled = true;
        });

    // Turn all correct answers green
    document.querySelectorAll(".answer-button")
        .forEach(button => {
            const key =
                button.dataset.tense + "|||" +
                button.dataset.person;

            if (correctSet.has(key)) {
                button.classList.add("correct");
                button.textContent = "✓";
                button.disabled = true;
            }
        });
	}
}

function selectAnswer(button) {

    if (answered) {
        return;
    }

    button.classList.toggle("selected");

    if (button.classList.contains("selected")) {
        button.textContent = "✓";
    }
    else {
        button.textContent = "";
    }
}

function nextQuestion() {

    questionIndex++;

	// display on final screen
    if (questionIndex >= questions.length) {

        document.getElementById("question").textContent =
            "Finished!";

        /*document.getElementById("score").textContent =
            "Final score: " +
            score +
            " / " +
            questions.length;*/

        //document.getElementById("grid").innerHTML = "";

        document.getElementById("next-button").style.display =
            "none";

        return;
    }

    displayQuestion();
}

</script>
</body>
</html>
